name: XConnect
options:
  bundleIdPrefix: id.xconnect
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
targets:
  XConnect:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Resources/Translations.tsv
      - path: Sources/Resources/Translations.tsv
        buildPhase: resources
    dependencies:
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.xconnect.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Base version x.y.z: x.y and the smallest z. The workflow raises z automatically on every build
        # (0.1.1 -> 0.1.2 -> ...). To move to 0.2, change this to "0.2.1" and push.
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: XConnect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - id
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedExternalAccessoryProtocols:
          - com.garmin.navilite.data
          - com.yconnect.data
        UIBackgroundModes:
          - external-accessory
          - bluetooth-central
          - location
          - audio
        NSBluetoothAlwaysUsageDescription: XConnect connects to the Yamaha motorcycle dash over Bluetooth to show the map.
        NSLocationWhenInUseUsageDescription: XConnect uses your location to draw the map on the motorcycle dash.
        NSBluetoothPeripheralUsageDescription: XConnect reads motorcycle data (battery, ODO, temperature) from the motorcycle ECU over Bluetooth.
        NSAppleMusicUsageDescription: XConnect shows the song that is playing on the motorcycle dash.
        NSLocationAlwaysAndWhenInUseUsageDescription: XConnect uses your location so the map on the dash keeps working while the screen is locked.
