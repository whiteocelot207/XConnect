name: XConnect
options:
  bundleIdPrefix: id.xconnect
  deploymentTarget:
    iOS: "15.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
targets:
  XConnect:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.xconnect.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: XConnect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedExternalAccessoryProtocols:
          - com.garmin.navilite.data
          - com.yconnect.data
        UIBackgroundModes:
          - external-accessory
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: XConnect terhubung ke dash motor Yamaha lewat Bluetooth untuk menampilkan peta.
        NSLocationWhenInUseUsageDescription: XConnect memakai lokasi untuk menggambar peta di dash motor.
        NSBluetoothPeripheralUsageDescription: XConnect membaca data motor (aki, ODO, suhu) dari ECU motor lewat Bluetooth.
        NSAppleMusicUsageDescription: XConnect menampilkan lagu yang sedang diputar di layar dash motor.
        NSLocationAlwaysAndWhenInUseUsageDescription: XConnect memakai lokasi agar peta di dash tetap jalan saat layar terkunci.
