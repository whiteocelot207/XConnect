name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Compute version (last digit rises on every build)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep 'MARKETING_VERSION' project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          MM="${BASE%.*}"          # x.y from project.yml
          P0="${BASE##*.}"         # base z from project.yml
          PREV=$(gh release view --repo "${{ github.repository }}" --json name -q .name 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          PATCH="$P0"
          if [ -n "$PREV" ] && [ "${PREV%.*}" = "$MM" ]; then
            N=$(( ${PREV##*.} + 1 ))
            if [ "$N" -gt "$PATCH" ]; then PATCH="$N"; fi
          fi
          V="$MM.$PATCH"
          echo "Previous release: ${PREV:-none}; new version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Versi Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project from project.yml
        run: xcodegen generate

      - name: Cache Swift packages (MapLibre)
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project XConnect.xcodeproj \
            -scheme XConnect \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project XConnect.xcodeproj \
            -scheme XConnect \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log

      - name: Set the version in Info.plist
        run: |
          APP="build/Build/Products/Release-iphoneos/XConnect.app"
          V="${{ steps.ver.outputs.version }}"
          B="${{ github.run_number }}"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleShortVersionString $V" "$APP/Info.plist" || $PB -c "Add :CFBundleShortVersionString string $V" "$APP/Info.plist"
          $PB -c "Set :CFBundleVersion $B" "$APP/Info.plist" || $PB -c "Add :CFBundleVersion string $B" "$APP/Info.plist"
          echo "Version in IPA: $($PB -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($($PB -c 'Print :CFBundleVersion' "$APP/Info.plist"))"

      - name: Package as .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/XConnect.app"
          test -d "$APP" || { echo "XConnect.app not found"; ls -R build/Build/Products | head -50; exit 1; }
          rm -rf Payload XConnect.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry XConnect.ipa Payload
          ls -lh XConnect.ipa

      # SideStore/AltStore source: the bundle ID here is the one used when installing
      - name: Buat source.json (SideStore/AltStore)
        run: |
          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          V="${{ steps.ver.outputs.version }}"
          B="${{ github.run_number }}"
          SIZE=$(stat -f%z XConnect.ipa)
          DATE=$(date -u +%Y-%m-%d)
          cat > source.json <<EOF
          {
            "name": "XConnect",
            "identifier": "id.xconnect.source",
            "apps": [
              {
                "name": "XConnect",
                "bundleIdentifier": "id.xconnect.app",
                "developerName": "$OWNER",
                "subtitle": "Map, motorcycle data and music on the Yamaha dash",
                "version": "$V",
                "versionDate": "$DATE",
                "versionDescription": "Version $V",
                "downloadURL": "https://github.com/$REPO/releases/download/v$V/XConnect.ipa",
                "localizedDescription": "XConnect for the Yamaha TFT dash.",
                "iconURL": "https://raw.githubusercontent.com/$REPO/main/Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                "size": $SIZE
              }
            ],
            "news": []
          }
          EOF
          cat source.json

      # Release notes = the section of CHANGELOG.md for this version (newest section if there is none)
      - name: Release notes
        run: |
          V="${{ steps.ver.outputs.version }}"
          awk -v v="$V" '/^## /{ if (found) exit; t=$2; sub(/^v/,"",t); if (t==v) { found=1; next } } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then awk '/^## /{ n++; next } n==1' CHANGELOG.md > notes.md; fi
          { echo "XConnect $V"; echo; cat notes.md; } > release-notes.md
          cat release-notes.md

      # This Release is what the app reads to check for updates (tag: v<version>)
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: XConnect ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            XConnect.ipa
            source.json
          make_latest: true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XConnect-ipa
          path: XConnect.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
