name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # perlu untuk membuat Release

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Hitung versi (digit terakhir naik tiap build)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep 'MARKETING_VERSION' project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          MM="${BASE%.*}"          # x.y dari project.yml
          P0="${BASE##*.}"         # z dasar dari project.yml
          PREV=$(gh release view --repo "${{ github.repository }}" --json name -q .name 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          PATCH="$P0"
          if [ -n "$PREV" ] && [ "${PREV%.*}" = "$MM" ]; then
            N=$(( ${PREV##*.} + 1 ))
            if [ "$N" -gt "$PATCH" ]; then PATCH="$N"; fi
          fi
          V="$MM.$PATCH"
          echo "Rilis sebelumnya: ${PREV:-tidak ada}; versi baru: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Versi Xcode
        run: xcodebuild -version

      - name: Pasang XcodeGen
        run: brew install xcodegen

      - name: Buat project Xcode dari project.yml
        run: xcodegen generate

      - name: Cache paket Swift (MapLibre)
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Resolve paket
        run: |
          xcodebuild -resolvePackageDependencies \
            -project XConnect.xcodeproj \
            -scheme XConnect \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build (tanpa tanda tangan)
        run: |
          set -o pipefail
          xcodebuild \
            -project XConnect.xcodeproj \
            -scheme XConnect \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log

      - name: Setel versi di Info.plist
        run: |
          APP="build/Build/Products/Release-iphoneos/XConnect.app"
          V="${{ steps.ver.outputs.version }}"
          B="${{ github.run_number }}"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleShortVersionString $V" "$APP/Info.plist" || $PB -c "Add :CFBundleShortVersionString string $V" "$APP/Info.plist"
          $PB -c "Set :CFBundleVersion $B" "$APP/Info.plist" || $PB -c "Add :CFBundleVersion string $B" "$APP/Info.plist"
          echo "Versi di IPA: $($PB -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($($PB -c 'Print :CFBundleVersion' "$APP/Info.plist"))"

      - name: Bungkus jadi .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/XConnect.app"
          test -d "$APP" || { echo "XConnect.app tidak ditemukan"; ls -R build/Build/Products | head -50; exit 1; }
          rm -rf Payload XConnect.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry XConnect.ipa Payload
          ls -lh XConnect.ipa

      # Sumber SideStore/AltStore: bundle ID di sini yang dipakai saat pemasangan
      - name: Buat source.json (SideStore/AltStore)
        run: |
          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          V="${{ steps.ver.outputs.version }}"
          B="${{ github.run_number }}"
          SIZE=$(stat -f%z XConnect.ipa)
          DATE=$(date -u +%Y-%m-%d)
          cat > source.json <<EOF
          {
            "name": "XConnect",
            "identifier": "id.xconnect.source",
            "apps": [
              {
                "name": "XConnect",
                "bundleIdentifier": "id.xconnect.app",
                "developerName": "$OWNER",
                "subtitle": "Peta, data motor, musik di dash Yamaha",
                "version": "$V",
                "versionDate": "$DATE",
                "versionDescription": "Versi $V",
                "downloadURL": "https://github.com/$REPO/releases/download/build-$B/XConnect.ipa",
                "localizedDescription": "XConnect untuk dash TFT Yamaha.",
                "iconURL": "https://raw.githubusercontent.com/$REPO/main/Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                "size": $SIZE
              }
            ],
            "news": []
          }
          EOF
          cat source.json

      # Release inilah yang dibaca app untuk cek update (tag: build-<nomor>)
      - name: Terbitkan Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: XConnect ${{ steps.ver.outputs.version }}
          body: |
            XConnect ${{ steps.ver.outputs.version }}
            ${{ github.event.head_commit.message }}
          files: |
            XConnect.ipa
            source.json
          make_latest: true

      - name: Unggah IPA
        uses: actions/upload-artifact@v4
        with:
          name: XConnect-ipa
          path: XConnect.ipa
          retention-days: 30

      - name: Unggah log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
